name: Build Windows Single EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect project directory
        shell: pwsh
        run: |
          if (Test-Path "$env:GITHUB_WORKSPACE\ai-main\requirements.txt") {
            "APP_DIR=ai-main" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Project directory: ai-main"
          } elseif (Test-Path "$env:GITHUB_WORKSPACE\requirements.txt") {
            "APP_DIR=." | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Project directory: repository root"
          } else {
            Write-Host "Repository contents:"
            Get-ChildItem -Path $env:GITHUB_WORKSPACE -Force | Format-Table Name, Mode
            throw "requirements.txt was not found in repository root or ai-main/."
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Install Playwright Chromium
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          python -m playwright install chromium

      - name: Copy Playwright browsers into the project
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          $browserSource = Join-Path $env:USERPROFILE 'AppData\Local\ms-playwright'
          if (-not (Test-Path $browserSource)) {
            throw "Playwright browser directory was not found: $browserSource"
          }
          if (Test-Path 'playwright-browsers') {
            Remove-Item 'playwright-browsers' -Recurse -Force
          }
          Copy-Item $browserSource 'playwright-browsers' -Recurse -Force

      - name: Build TRUE single-file EXE
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          python -m PyInstaller --clean --noconfirm windows_onefile.spec

      - name: Verify single EXE output
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          if (-not (Test-Path 'dist\JeongSoyoonAI.exe')) {
            throw 'dist\JeongSoyoonAI.exe was not created.'
          }
          Write-Host "Built: $(Resolve-Path 'dist\JeongSoyoonAI.exe')"
          Get-Item 'dist\JeongSoyoonAI.exe' | Select-Object Name, Length, FullName

      - name: Smoke test EXE startup
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          $process = Start-Process -FilePath '.\dist\JeongSoyoonAI.exe' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8501/' -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 500) {
                  $ready = $true
                  break
                }
              } catch { }
            }
            if (-not $ready) {
              throw 'JeongSoyoonAI.exe did not start Streamlit on 127.0.0.1:8501 within 90 seconds.'
            }
            Write-Host 'Smoke test passed: Streamlit is listening on port 8501.'
          } finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload single EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: JeongSoyoonAI-Windows-Single-EXE
          path: ${{ env.APP_DIR }}/dist/JeongSoyoonAI.exe
          if-no-files-found: error
          retention-days: 30
