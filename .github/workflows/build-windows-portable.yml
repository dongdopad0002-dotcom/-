name: Build Windows portable EXE

on:
  workflow_dispatch:
  push:
    branches: [work]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build self-contained executable
        shell: pwsh
        run: ./scripts/build_windows_portable.ps1
      - name: Smoke-test portable executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$PWD/dist/JeongSoyoonAI/JeongSoyoonAI.exe" -PassThru
          try {
            $deadline = (Get-Date).AddMinutes(2)
            $healthy = $false
            $rootReady = $false

            do {
              try {
                $health = Invoke-WebRequest -UseBasicParsing -SkipHttpErrorCheck http://127.0.0.1:8501/_stcore/health
                if ($health.StatusCode -eq 200) {
                  $healthy = $true
                  Write-Host "Streamlit health endpoint: HTTP 200"

                  $page = Invoke-WebRequest -UseBasicParsing -SkipHttpErrorCheck http://127.0.0.1:8501/
                  $preview = if ($page.Content) {
                    $page.Content.Substring(0, [Math]::Min(500, $page.Content.Length))
                  } else {
                    ""
                  }
                  Write-Host "Streamlit root response: HTTP $($page.StatusCode), content-type=$($page.Headers['Content-Type'])"
                  Write-Host "Streamlit root response preview: $preview"

                  if ($page.StatusCode -eq 200 -and $page.Content -match "<html") {
                    $rootReady = $true
                    Write-Host "Portable EXE and Streamlit UI started successfully."
                    break
                  }

                  Write-Host "Health is ready, but the Streamlit frontend is not ready yet."
                }
              } catch {
                Write-Host "Waiting for portable Streamlit: $($_.Exception.Message)"
              }
              Start-Sleep -Seconds 2
            } while ((Get-Date) -lt $deadline)

            if (-not $healthy) {
              throw "Portable EXE did not expose Streamlit's health endpoint within two minutes."
            }
            if (-not $rootReady) {
              throw "Portable EXE exposed Streamlit health, but GET / did not return the bundled Streamlit HTML frontend."
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: JeongSoyoonAI-Windows
          path: dist/JeongSoyoonAI
          if-no-files-found: error
